name: Sync upstream dev into fork dev (merge)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream
        run: |
          if git remote | grep -q upstream; then
            git remote set-url upstream https://github.com/OZ-Coding-School/oz_externship_fe_05_team2.git
          else
            git remote add upstream https://github.com/OZ-Coding-School/oz_externship_fe_05_team2.git
          fi

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/dev into fork/dev
        run: git merge upstream/dev --no-edit

      - name: Push fork dev
        run: git push origin dev
